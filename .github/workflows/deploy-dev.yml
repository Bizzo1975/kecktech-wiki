name: Deploy to Dev — kecktech wiki

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to dev-wiki-01 (VMID 732)
        shell: powershell
        run: |
          $sshExe = "C:\Program Files\Git\usr\bin\ssh.exe"
          $keyPath = "C:\Users\jonkd\.ssh\id_ed25519"
          $script = "cd /opt/docker/wiki && git fetch origin dev && git merge --ff-only origin/dev && docker compose up -d --build && echo DEPLOY_SUCCESS"
          & $sshExe -o StrictHostKeyChecking=yes -o BatchMode=yes -i $keyPath kecktech@10.30.0.145 $script
          if ($LASTEXITCODE -ne 0) { throw "Deploy failed with exit code $LASTEXITCODE" }
